name: Test and deploy phone importer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt unicorn==2.1.4
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_native_size.py --clang /usr/bin/clang
      - run: python tools/check_native_arm.py artifacts/native-size/sizecheck-only.elf
      - run: python tools/build_overlay207.py --clang /usr/bin/clang
      - run: python tools/check_overlay207.py artifacts/overlay207
      - run: python tools/check_native_arm.py artifacts/overlay207/overlay207-offline.elf --overlay
      - run: node --check phone/app.js && node --check phone/codec.js && node --check phone/store.js
  native-host:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/native-host-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: python tools/prepare_native_host.py --fetch
      - run: cargo +1.99.1 fmt --manifest-path native-host/Cargo.toml -- --check
      - run: cargo +1.99.1 test --manifest-path native-host/Cargo.toml --locked
      - run: cargo +1.99.1 test --manifest-path .deps/native-host/km003c-rs/km003c-lib/Cargo.toml --features hw23-overlay --lib firmware:: --locked
      - run: cargo +1.99.1 build --manifest-path native-host/Cargo.toml --locked
  deploy:
    needs: [test, native-host]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone
      - uses: actions/deploy-pages@v5
        id: deployment
