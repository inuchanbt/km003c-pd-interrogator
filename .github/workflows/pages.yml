name: Test and deploy phone importer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt unicorn==2.1.4
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_native_size.py --clang /usr/bin/clang
      - run: python tools/check_native_arm.py artifacts/native-size/sizecheck-only.elf
      - run: node --check phone/app.js && node --check phone/codec.js && node --check phone/store.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phone
      - uses: actions/deploy-pages@v5
        id: deployment
